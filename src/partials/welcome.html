<!-- 引导页 + 首次使用 3 步（设计文档 5.1、6.1、6.2） -->
<section class="page page-welcome" x-show="route === 'welcome'" x-cloak>

  <!-- 0 · 欢迎 -->
  <div class="welcome" x-show="onboardStep === 0">
    <div class="welcome-art" x-data="cardShowcase">
      <div class="showcase-heading" aria-hidden="true"><span class="fine-line"></span><span>LUNAR ARCANUM</span><span class="fine-line"></span></div>
      <div class="showcase" role="group" :aria-label="t('welcome.gallery')" :class="{ 'is-dragging': dragging }"
           @pointerdown="down($event)" @pointermove="move($event)" @pointerup="up($event)"
           @pointercancel="cancel()" @lostpointercapture="cancel()" @pointerleave="leave()"
           @keydown.arrow-left.prevent="step(-1)" @keydown.arrow-right.prevent="step(1)"
           @keydown.home.prevent="select(0)" @keydown.end.prevent="select(fanCards.length - 1)">
        <div class="showcase-aura" aria-hidden="true"></div>
        <div class="celestial-seal" aria-hidden="true">
          <div class="seal-ring seal-ring-outer"></div><div class="seal-ring seal-ring-inner"></div>
          <span class="seal-star seal-star-a">✦</span><span class="seal-star seal-star-b">✦</span><span class="seal-star seal-star-c">✧</span>
        </div>
        <div class="showcase-floor" aria-hidden="true"></div>
        <template x-for="(id, i) in fanCards" :key="id">
          <button type="button" class="showcase-card" :class="{ 'is-active': activeIndex === i }"
                  :style="`--offset:${offset(i)}; --distance:${Math.abs(offset(i))}; --card-color:${card(id).color}`"
                  :aria-label="cardName(id)" :aria-pressed="activeIndex === i" @click="select(i)">
            <span class="showcase-card-face">
              <img :src="card(id).img.m" alt="" draggable="false" width="360" height="539">
              <span class="showcase-sheen" aria-hidden="true"></span>
              <span class="showcase-corner" aria-hidden="true"></span>
            </span>
          </button>
        </template>
      </div>
      <div class="showcase-caption" aria-live="polite" aria-atomic="true">
        <span class="showcase-roman" x-text="card(fanCards[activeIndex]).roman"></span>
        <b>BetterGI</b>
      </div>
    </div>

    <div class="welcome-copy">
    <h1 class="welcome-title" x-text="t('app.short')"></h1>
    <p class="welcome-description" x-text="t('welcome.description')"></p>

    <ol class="welcome-steps">
      <template x-for="(s, i) in t('welcome.steps')" :key="i">
        <li><b x-text="i + 1"></b><span x-text="s"></span></li>
      </template>
    </ol>

    <button class="btn btn-primary btn-block btn-shine" @click="startOnboarding()">
      <span x-text="t('welcome.start')"></span><svg class="icon" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#arrow-right'"></use></svg>
    </button>

    <button class="link-btn" x-show="accountType === 'bili' && !profile && !profileDeclined" @click="useBiliProfile()">
      <span class="bili-dot"><svg class="icon icon-sm" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#bilibili'"></use></svg></span><span x-text="t('welcome.useBili')"></span>
    </button>
    <p class="welcome-note" x-show="accountType === 'bili' && profile">
      <svg class="icon icon-sm" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#check'"></use></svg> <span x-text="profile?.nickname"></span>
    </p>

    <div class="lang-switch">
      <template x-for="l in langs" :key="l.code">
        <button :class="{ on: lang === l.code }" @click="lang = l.code" x-text="l.label"></button>
      </template>
    </div>
    </div>
  </div>

  <!-- 1 · UID -->
  <div class="onboard" x-show="onboardStep === 1">
    <div class="onboard-top">
      <button class="icon-btn" @click="onboardStep = 0" :aria-label="t('common.back')"><svg class="icon" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#chevron-left'"></use></svg></button>
      <div class="moon-steps" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
      <span class="onboard-step" x-text="t('onboard.step', { n: 1 })"></span>
    </div>
    <h2 class="onboard-title" x-text="t('onboard.uidTitle')"></h2>
    <div class="uid-field" :class="{ 'is-bad': uidState.state === 'invalid' }">
      <input class="uid-input" inputmode="numeric" autocomplete="off" maxlength="13" :placeholder="t('onboard.uidPlaceholder')"
             :value="uidInput" @input="onUidInput($event)" @keydown.enter="confirmUid()" x-init="$watch('onboardStep', v => v === 1 && $nextTick(() => $el.focus()))">
    </div>
    <div class="server-slot">
      <template x-if="uidState.state === 'ok'">
        <div class="server-badge flip-in" :data-tone="servers[serverKeyOf(uidInput)]?.tone">
          <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" class="moon-dark"/><path :d="moonPath(0.5)" class="moon-lit"/></svg>
          <span x-text="serverName(serverKeyOf(uidInput)) + ' · ' + servers[serverKeyOf(uidInput)].name.en"></span>
        </div>
      </template>
      <p class="hint" x-show="uidState.state === 'typing'" x-text="t('onboard.uidTyping')"></p>
      <p class="hint is-bad" x-show="uidState.state === 'invalid'" x-text="t('onboard.uidInvalid')"></p>
      <p class="hint is-warn" x-show="uidState.state === 'unknown'" x-text="t('onboard.uidUnknown')"></p>
    </div>
    <button class="btn btn-primary btn-block" :aria-disabled="!uidReady" :aria-busy="busy" @click="confirmUid()" x-text="t('common.next')"></button>
    <p class="privacy"><svg class="icon icon-sm" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#lock'"></use></svg> <span x-text="t('onboard.privacy')"></span></p>
  </div>

  <!-- 2 · 开始方式 -->
  <div class="onboard" x-show="onboardStep === 2">
    <div class="onboard-top">
      <button class="icon-btn" @click="onboardStep = 1" :aria-label="t('common.back')"><svg class="icon" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#chevron-left'"></use></svg></button>
      <div class="moon-steps" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i></div>
      <span class="onboard-step" x-text="t('onboard.step', { n: 2 })"></span>
    </div>
    <h2 class="onboard-title" x-text="t('onboard.modeTitle')"></h2>
    <button class="mode-card" @click="chooseMode('quick')">
      <span class="mode-icon"><svg class="icon icon-lg" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#bolt'"></use></svg></span>
      <span><b x-text="t('onboard.quickTitle')"></b><small x-text="t('onboard.quickDesc')"></small></span>
      <span class="chev"><svg class="icon icon-sm" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#chevron-right'"></use></svg></span>
    </button>
    <button class="mode-card" @click="chooseMode('full')">
      <span class="mode-icon"><svg class="icon icon-lg" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#cards'"></use></svg></span>
      <span><b x-text="t('onboard.fullTitle')"></b><small x-text="t('onboard.fullDesc')"></small></span>
      <span class="chev"><svg class="icon icon-sm" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#chevron-right'"></use></svg></span>
    </button>
  </div>
</section>
