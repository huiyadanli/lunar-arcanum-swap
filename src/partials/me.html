<!-- 我的（设计文档 6.6；两类用户的账号卡片不同） -->
<section class="page page-me" x-show="route === 'me'" x-cloak>
  <header class="page-head"><h1 x-text="t('me.title')"></h1></header>

  <!-- 账号卡片 -->
  <div class="account arch">
    <div class="account-top">
      <div class="avatar" :class="{ bili: accountType === 'bili' }">
        <template x-if="accountType === 'bili' && profile">
          <span class="avatar-fill">
            <img class="avatar-img" x-show="profile.avatar && !avatarBroken" :src="profile.avatar" alt="" referrerpolicy="no-referrer" @error="avatarBroken = true">
            <span class="avatar-letter" x-show="!profile.avatar || avatarBroken" x-text="(profile.nickname || '?').slice(0, 1)"></span>
          </span>
        </template>
        <template x-if="!(accountType === 'bili' && profile)">
          <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" class="moon-dark"/><path :d="moonPath(0.35)" class="moon-lit"/></svg>
        </template>
        <span class="avatar-tag" x-show="accountType === 'bili'"><svg class="icon" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#bilibili'"></use></svg></span>
      </div>
      <div class="account-name">
        <b x-text="displayName"></b>
        <span class="tag" :class="accountType === 'bili' ? 'tag-bili' : 'tag-anon'" x-text="accountType === 'bili' ? t('me.biliTag') : t('me.anonTag')"></span>
      </div>
    </div>

    <template x-if="accountType === 'bili'">
      <div class="account-sub">
        <button class="sync" :class="'sync-' + syncState" @click="flushCloudSync()">
          <span x-show="syncState === 'synced'"><svg class="icon icon-sm" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#cloud-check'"></use></svg> <span x-text="t('me.synced')"></span></span>
          <span x-show="syncState === 'syncing'"><svg class="icon icon-sm icon-spin" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#refresh'"></use></svg> <span x-text="t('me.syncing')"></span></span>
          <span x-show="syncState === 'error'"><svg class="icon icon-sm" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#alert'"></use></svg> <span x-text="t('me.syncError')"></span></span>
        </button>
        <button class="link-btn" x-show="!profile && !profileDeclined" @click="useBiliProfile()" x-text="t('welcome.useBili')"></button>
      </div>
    </template>
    <template x-if="accountType === 'anon'">
      <div class="account-sub">
        <p class="warn"><svg class="icon icon-sm" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#alert'"></use></svg> <span x-text="t('me.anonWarn')"></span></p>
        <p class="hint" x-show="loginHint" x-text="t('me.loginHint')"></p>
      </div>
    </template>

    <div class="account-uid">
      <span class="server-badge sm" :data-tone="servers[serverKey]?.tone" x-text="serverName(serverKey)"></span>
      <span class="uid-mono" x-text="'UID ' + (uidPeek ? uid : mask(uid))"></span>
      <button class="icon-btn sm" @click="peekUid()" aria-label="显示完整 UID"><svg class="icon icon-sm" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#eye'"></use></svg></button>
      <button class="link-btn" @click="editUid()" x-text="t('me.editUid')"></button>
    </div>
    <div class="hint" x-text="t('me.creditLine', { moons: moons(5), level: t('me.creditGood'), n: completedCount })"></div>
  </div>

  <!-- B站专属入口 -->
  <div class="list" x-show="accountType === 'bili'">
    <button class="list-row" @click="followFromMe()">
      <span class="list-icon"><svg class="icon" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#' + (followCache === true ? 'check' : 'heart')"></use></svg></span><span x-text="platform.author.isAuthor ? t('follow.authorSelf') : followCache === true ? t('follow.followed') : t('follow.row')"></span><span class="chev"><svg class="icon icon-sm" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#chevron-right'"></use></svg></span>
    </button>
    <button class="list-row" x-show="wide" @click="openQr()">
      <span class="list-icon"><svg class="icon" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#qr'"></use></svg></span><span x-text="t('me.qr')"></span><span class="chev"><svg class="icon icon-sm" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#chevron-right'"></use></svg></span>
    </button>
  </div>

  <!-- 设置 -->
  <div class="list">
    <div class="list-row static">
      <span class="list-icon"><svg class="icon" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#language'"></use></svg></span><span x-text="t('me.lang')"></span>
      <div class="seg sm">
        <template x-for="l in langs" :key="l.code">
          <button :class="{ on: lang === l.code }" @click="lang = l.code" x-text="l.label"></button>
        </template>
      </div>
    </div>
    <div class="list-row static">
      <span class="list-icon"><svg class="icon" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#sparkles'"></use></svg></span><span x-text="t('me.fx')"></span>
      <button class="switch" :class="{ on: fxOn }" @click="toggleFx()" role="switch" :aria-checked="fxOn" :aria-label="t('me.fx')"><i></i></button>
    </div>
    <div class="list-row static">
      <span class="list-icon"><svg class="icon" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#layers'"></use></svg></span><span x-text="t('me.keep')"></span>
      <div class="seg sm">
        <template x-for="k in [0, 1, 2]" :key="k">
          <button :class="{ on: keep === k }" @click="keep = k" x-text="k"></button>
        </template>
      </div>
    </div>
    <div class="list-row static" x-show="platform.env === 'standalone'">
      <span class="list-icon"><svg class="icon" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#bell'"></use></svg></span><span x-text="t('me.notify')"></span>
      <button class="switch" :class="{ on: notify }" @click="notify = !notify" role="switch" :aria-checked="notify"><i></i></button>
    </div>
  </div>

  <div class="list">
    <button class="list-row" @click="exportBox()"><span class="list-icon"><svg class="icon" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#download'"></use></svg></span><span x-text="t('me.exportBox')"></span><span class="chev"><svg class="icon icon-sm" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#chevron-right'"></use></svg></span></button>
    <button class="list-row" @click="openBoxImport()"><span class="list-icon"><svg class="icon" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#import'"></use></svg></span><span x-text="t('me.importBox')"></span><span class="chev"><svg class="icon icon-sm" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#chevron-right'"></use></svg></span></button>
    <button class="list-row" @click="openImageBoxImport()"><span class="list-icon"><svg class="icon" aria-hidden="true"><use :href="imageImportIcons + '#cards'"></use></svg></span><span x-text="t('imageImport.entry')"></span><span class="chev"><svg class="icon icon-sm" aria-hidden="true"><use :href="imageImportIcons + '#chevron-right'"></use></svg></span></button>
    <button class="list-row danger" @click="clearAll()"><span class="list-icon"><svg class="icon" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#trash'"></use></svg></span><span x-text="t(accountType === 'bili' ? 'me.clearBili' : 'me.clear')"></span><span class="chev"><svg class="icon icon-sm" aria-hidden="true" focusable="false"><use :href="imageImportIcons + '#chevron-right'"></use></svg></span></button>
  </div>
  <p class="hint center foot"><span x-text="t('me.help')"></span><br><a class="brand-link" :href="t('app.url')" target="_blank" rel="noopener noreferrer" x-text="t('app.project')"></a></p>
</section>
